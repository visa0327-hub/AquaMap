<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>AquaMap – Gertuvių žemėlapis</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>

<h2>Panevėžio gertuvių žemėlapis</h2>
<div id="map"></div>

<script>
    const map = L.map('map').setView([55.7369, 24.3234], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    fetch('fountainsData.json')
        .then(response => response.json())
        .then(data => {
            data.forEach(f => {
                L.marker([f.lat, f.lng]).addTo(map)
                    .bindPopup(`<b>${f.name}</b><br>${f.address}<br>${f.description}`);
            });
        });
</script>

</body>
</html>
