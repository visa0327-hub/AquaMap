<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>AquaMap – Gertuvių žemėlapis</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>

<h2>Panevėžio gertuvių žemėlapis</h2>
<div id="map"></div>
<button id="ortofotoBtn">Ortofoto</button>
<script>
    const map = L.map('map').setView([55.726109, 24.362273], 16);
// Įprastas OSM sluoksnis
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

const ortoLayer = L.tileLayer(
  'https://tiles.openaerialmap.org/tiles/1.0.0/satellite/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenAerialMap'
  }
);

    document.getElementById('ortofotoBtn').addEventListener('click', () => {
    if (map.hasLayer(ortoLayer)) {
        map.removeLayer(ortoLayer);
        osmLayer.addTo(map);
        document.getElementById('ortofotoBtn').innerText = "Ortofoto";
    } else {
        map.removeLayer(osmLayer);
        ortoLayer.addTo(map);
        document.getElementById('ortofotoBtn').innerText = "OSM";
    }
});

    fetch('fountainsData.json')
        .then(response => response.json())
        .then(data => {
            data.forEach(f => {
                L.marker([f.lat, f.lon]).addTo(map)
                    .bindPopup(`
    <b>${f.name}</b><br>
    ${f.details}<br>
    <img src="${f.photo}" style="width:200px; margin-top:8px; border-radius:6px;">
`);
            });
        });
</script>

</body>
</html>
