<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>AquaMap – Gertuvių ir kolonėlių žemėlapis</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Stilius -->
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Žalia kolonėlės ikona – nudažome mėlyną marker.png */
        .green-icon {
            filter: hue-rotate(120deg) saturate(200%);
        }

        /* Žemėlapio konteineris */
        #map {
            width: 100%;
            height: 90vh;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<h2>Panevėžio gertuvių ir kolonėlių žemėlapis</h2>
<div id="map"></div>

<script>
    // Sukuriame žemėlapį
    const map = L.map('map').setView([55.7369, 24.3234], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // Mėlyna ikona (gertuvių)
    const fountainIcon = L.icon({
    iconUrl: 'marker.png',
    iconSize: [32, 32],
    className: 'blue-icon'
});

    // Žalia ikona (kolonėlių)
    const koloneleIcon = L.icon({
        iconUrl: 'marker.png',
        iconSize: [32, 32],
        className: 'green-icon'
    });

    // Įkeliame duomenis
    fetch('fountainsData.json')
        .then(response => response.json())
        .then(data => {
            data.forEach(item => {
                const icon = item.type === "kolonele" ? koloneleIcon : fountainIcon;

                L.marker([item.lat, item.lon], { icon })
                    .addTo(map)
                    .bindPopup(`<b>${item.name}</b><br>${item.details}`);
            });
        });
</script>

</body>
</html>
